name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate scientific data
        run: python tools/validate_data.py --verbose

      - name: Validate research provenance layer
        run: python tools/validate_research.py --verbose

      - name: Run tests
        run: pytest

      - name: Build catalog (test run)
        run: python tools/build_catalog.py

      - name: Export graph (test run)
        run: python tools/export_graph.py

      - name: Build site (strict)
        run: mkdocs build --strict
