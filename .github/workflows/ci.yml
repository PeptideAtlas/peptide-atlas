name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate scientific data
        run: python tools/validate_data.py --verbose

      - name: Validate research provenance layer
        run: python tools/validate_research.py --verbose

      - name: Check research search run immutability
        run: python tools/check_research_immutability.py

      - name: Run tests
        run: pytest

      - name: Build catalog (test run)
        run: python tools/build_catalog.py

      - name: Export graph (test run)
        run: python tools/export_graph.py

      - name: Build site (strict)
        run: mkdocs build --strict

  web-validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
