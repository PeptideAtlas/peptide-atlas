site_name: Peptide Atlas
site_description: >-
  Wissenschaftlich orientierte Wissensdatenbank über Peptide, peptidbasierte
  Arzneimittel, Rezeptoren, Signalwege und experimentelle Forschungsstoffe.
site_url: https://peptideatlas.github.io/peptide-atlas/
site_author: Peptide Atlas
repo_url: https://github.com/PeptideAtlas/peptide-atlas
repo_name: PeptideAtlas/peptide-atlas
edit_uri: edit/main/docs/
copyright: >-
  Peptide Atlas dient ausschließlich der wissenschaftlichen Information und
  ersetzt keine medizinische Beratung, Diagnose oder Therapieempfehlung.
  Siehe <a href="haftungshinweis/">vollständigen Haftungshinweis</a>.

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Zu dunklem Design wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Zu hellem Design wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: de
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra:
  generator: false

nav:
  - Start: index.md
  - Grundlagen:
      - Was sind Peptide?: 00_grundlagen/was_sind_peptide.md
      - Evidenzsystem: 00_grundlagen/evidenzsystem.md
      - Redaktionsstandard: 00_grundlagen/redaktionsstandard.md
  - Wirkstoffe: 01_wirkstoffe/index.md
  - Biologie:
      - Übersicht: 02_biologie/index.md
      - Rezeptoren: 02_biologie/rezeptoren.md
  - Indikationen: 03_indikationen/index.md
  - Studien: 04_studien/index.md
  - Vergleiche: 05_vergleiche/index.md
  - Medien: 06_medien/index.md
  - Glossar: 07_glossar/index.md
  - Tags: tags.md
  - Projekt:
      - Roadmap: roadmap.md
      - Haftungshinweis: haftungshinweis.md
  - Architektur:
      - Übersicht: project/index.md
      - Vision: project/Vision.md
      - Mission: project/Mission.md
      - Architecture: project/Architecture.md
      - Data Model: project/Data_Model.md
      - Knowledge Graph: project/Knowledge_Graph.md
      - Phase 3 Scientific Data Architecture: project/Phase_3_Scientific_Data_Architecture.md
      - Scientific Research Protocol: project/Scientific_Research_Protocol.md
      - Evidence Curation Workflow: project/Evidence_Curation_Workflow.md
      - "Phase 4B-1B-2 – Deduplication & Workflow Architecture (Proposed)": project/Phase_4B_1B_2_Deduplication_and_Workflow_Architecture.md
      - Retatrutide Pilot Research Protocol: project/Retatrutide_Pilot_Research_Protocol.md
      - Editorial Policy: project/Editorial_Policy.md
      - Quality Standards: project/Quality_Standards.md
      - Contribution Guide: project/Contribution_Guide.md
      - Workflow: project/Workflow.md
      - Naming Conventions: project/Naming_Conventions.md
      - Release Strategy: project/Release_Strategy.md
      - Versioning: project/Versioning.md
      - Glossary for Developers: project/Glossary_For_Developers.md
      - Decision Log: project/Decision_Log.md
      - Future Roadmap: project/Future_Roadmap.md
